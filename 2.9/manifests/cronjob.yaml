apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-cron
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-cron
              image: todo-cron:2.9
              imagePullPolicy: IfNotPresent
              env:
                - name: TODO_BACKEND_URL
                  value: "http://todo-backend-svc:2345"
